services:
  - type: web
    name: soource-discord-forwarder
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_AUTHORIZATION
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: ALLOW_WRITE
        value: "true"
      - key: OWNER_USER_ID
        value: ""
      - key: GUILD_IDS
        value: ""
      - key: CHANNEL_IDS
        value: ""
      - key: FORWARD_MODE
        value: all
